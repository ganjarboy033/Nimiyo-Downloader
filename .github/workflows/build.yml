name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core@^5.0.0 @capacitor/cli@^5.0.0 @capacitor/android@^5.0.0

      - name: Fetch Scrapers from coflyn/scrapr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src/scrapers
          mkdir -p src/utils
          gh repo clone coflyn/scrapr temp-scrapr -- --depth 1
          cp -r temp-scrapr/lib/* src/scrapers/
          rm -rf temp-scrapr

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Properly
        run: npx cap sync android

      - name: Fix gradle.properties & Build APK
        run: |
          cd android
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nimiyo-Downloader-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
